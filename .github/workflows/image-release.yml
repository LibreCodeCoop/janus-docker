name: Promote release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: janus-release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/librecodecoop/janus

jobs:
  publish-release:
    name: Promote reviewed commit digest to release tag
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify tag matches upstream and an approved main commit
        shell: bash
        run: |
          set -euo pipefail
          upstream="$(sed -n -E 's/^ARG JANUS_VERSION=([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' Dockerfile)"
          test -n "$upstream"
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-r[1-9][0-9]*$ ]]
          [[ "$GITHUB_REF_NAME" == "v$upstream"-r* ]]
          git fetch --no-tags origin main
          # HEAD is the resolved commit even when the Git ref is an annotated tag.
          commit="$(git rev-parse 'HEAD^{commit}')"
          git merge-base --is-ancestor "$commit" origin/main
      - name: Promote the existing tested commit manifest, without rebuilding
        shell: bash
        run: |
          set -euo pipefail
          release_tag="${GITHUB_REF_NAME#v}"
          commit="$(git rev-parse 'HEAD^{commit}')"
          source_image="$IMAGE:sha-$commit"
          release_image="$IMAGE:$release_tag"
          if docker buildx imagetools inspect "$release_image" >/dev/null 2>&1; then
            echo "Release image already exists: $release_image" >&2
            exit 1
          fi
          docker buildx imagetools inspect --raw "$source_image" > source-index.json
          jq -e '[.manifests[] | select(.platform.os == "linux") | .platform.architecture] |
            (index("amd64") != null and index("arm64") != null)' source-index.json
          docker buildx imagetools create --tag "$release_image" "$source_image"
          docker buildx imagetools inspect --raw "$release_image" > release-index.json
          cmp source-index.json release-index.json
          digest="sha256:$(sha256sum release-index.json | cut -d ' ' -f1)"
          echo "Release image: $release_image@$digest" >> "$GITHUB_STEP_SUMMARY"
