name: Actionlint

on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # actionlint v1.7.12 does not yet parse GitHub's supported $/ self-repository syntax.
      # Remove the narrowly scoped diagnostic workaround after rhysd/actionlint#711 lands.
      - name: Validate GitHub Actions workflow syntax and expressions
        run: |
          # renovate: datasource=docker depName=rhysd/actionlint
          docker run --rm --volume "$PWD:/repo:ro" --workdir /repo \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color \
              -ignore 'reusable workflow call "\$/.github/workflows/image-(ci|release)\.yml" at "uses" is not following the format'
