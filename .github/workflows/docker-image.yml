name: Docker image

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * *"

permissions:
  contents: read

concurrency:
  group: janus-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  IMAGE: ghcr.io/librecodecoop/janus

jobs:
  policy:
    name: Bats policy and release checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Bats
        uses: bats-core/bats-action@77d6fb60505b4d0d1d73e48bd035b55074bbfb43 # 4.0.0
        with:
          support-install: false
          assert-install: false
          detik-install: false
          file-install: false
      - name: Run policy tests
        run: bats tests/policy.bats tests/scan-images.bats
      - name: ShellCheck vulnerability scanner wrapper
        run: shellcheck scripts/scan-images.sh
      - name: Validate immutable Compose example
        shell: bash
        run: |
          tag="ci"
          digest="sha256:$(printf '%064d' 0)"
          JANUS_IMAGE_TAG="$tag" JANUS_IMAGE_DIGEST="$digest" docker compose config --quiet
      - name: Validate release version matches upstream Janus
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          upstream="$(sed -n -E 's/^ARG JANUS_VERSION=([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' Dockerfile)"
          test -n "$upstream"
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-r[1-9][0-9]*$ ]]
          [[ "$GITHUB_REF_NAME" == "v$upstream"-r* ]]

  image:
    name: Build and Bats test (${{ matrix.platform }})
    needs: policy
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            arch: amd64
          - platform: linux/arm64
            arch: arm64
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Bats
        uses: bats-core/bats-action@77d6fb60505b4d0d1d73e48bd035b55074bbfb43 # 4.0.0
        with:
          support-install: false
          assert-install: false
          detik-install: false
          file-install: false
      - name: Enable ARM emulation
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          platforms: arm64
      - name: Setup Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build without publishing
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          pull: true
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          tags: janus-ci:verify
          cache-from: type=gha,scope=janus-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=janus-${{ matrix.arch }}
      - name: Run Bats runtime tests
        env:
          JANUS_TEST_IMAGE: janus-ci:verify
        run: bats tests/image.bats
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          # renovate: datasource=github-releases depName=aquasecurity/trivy
          version: v0.75.0
          cache: true
      - name: Scan image and export SARIF
        run: bash scripts/scan-images.sh "janus@${{ matrix.platform }}=janus-ci:verify"
      - name: Upload vulnerability report
        if: always() && hashFiles('trivy-results/*.sarif') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-janus-${{ matrix.arch }}
          path: trivy-results/*.sarif
          if-no-files-found: error
      - name: Publish SARIF to code scanning
        if: always() && github.ref == 'refs/heads/main' && github.event_name == 'push' && hashFiles('trivy-results/*.sarif') != ''
        uses: github/codeql-action/upload-sarif@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3.39.1
        with:
          sarif_file: trivy-results/janus-linux-${{ matrix.arch }}.sarif
          category: trivy-janus-linux-${{ matrix.arch }}

  publish:
    name: Publish verified multiarch release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [policy, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate approved release tag and ancestry
        id: release
        shell: bash
        run: |
          set -euo pipefail
          upstream="$(sed -n -E 's/^ARG JANUS_VERSION=([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' Dockerfile)"
          test -n "$upstream"
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-r[1-9][0-9]*$ ]]
          [[ "$GITHUB_REF_NAME" == "v$upstream"-r* ]]
          image_tag="${GITHUB_REF_NAME#v}"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          printf 'tag=%s\n' "$image_tag" >> "$GITHUB_OUTPUT"
      - name: Enable ARM emulation
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          platforms: arm64
      - name: Setup Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Reject reused release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if docker buildx imagetools inspect "$IMAGE:$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Image tag already exists; do not republish an immutable release" >&2
            exit 1
          fi
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=match,pattern=^v(.*)$,group=1
            type=sha,format=long
          labels: |
            org.opencontainers.image.version=${{ steps.release.outputs.tag }}
            org.opencontainers.image.vendor=LibreCode
      - name: Publish versioned amd64/arm64 image, SBOM and provenance
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          pull: true
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=janus-release
          cache-to: type=gha,mode=max,scope=janus-release
      - name: Verify published manifest digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -eu
          test -n "$DIGEST"
          docker buildx imagetools inspect "$IMAGE@$DIGEST"
          echo "Deploy by digest: $IMAGE:$RELEASE_TAG@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
