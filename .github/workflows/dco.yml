name: DCO

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read

jobs:
  dco:
    if: github.actor != 'dependabot[bot]' && github.actor != 'renovate[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify DCO trailers on every commit in this PR
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_REF"
          failures=0
          while IFS= read -r sha; do
            email="$(git show -s --format=%ae "$sha")"
            signers="$(git show -s --format='%(trailers:key=Signed-off-by,valueonly)' "$sha")"
            if ! grep -Fqi "<$email>" <<< "$signers"; then
              printf 'Missing matching DCO trailer on %s (%s)\n' "$sha" "$email" >&2
              failures=1
            fi
          done < <(git rev-list "origin/$BASE_REF..HEAD")
          exit "$failures"
