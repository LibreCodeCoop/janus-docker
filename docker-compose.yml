# Optional, standalone example. The actual Nextcloud HPB deployment lives elsewhere.
# Both variables are REQUIRED. Never use :latest or build the image in production.
services:
  janus:
    image: ghcr.io/librecodecoop/janus:${JANUS_IMAGE_TAG:?Set reviewed image release tag}@${JANUS_IMAGE_DIGEST:?Set published sha256 digest}
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    # A running deployment must supply its own Janus configuration and
    # network/UDP rules. This example intentionally publishes no ports.
    volumes:
      - type: bind
        source: ./config
        target: /usr/local/etc/janus
        read_only: true
        bind:
          create_host_path: false
